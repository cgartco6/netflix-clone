version: '3.8'

services:
  media-server:
    image: jellyfin/jellyfin:latest
    container_name: netflix_engine
    ports:
      - "8096:8096"
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
      - TZ=UTC
    volumes:
      - ./config:C:/config
      - ./cache:C:/cache
      # Map your Windows external drive letters here (e.g., E:\ and F:\)
      - E:/:/data/external_hdd:ro
      - F:/:/data/external_ssd:ro
    restart: unless-stopped
